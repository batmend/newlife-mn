<!-- Supabase → Authentication → Emails → "Reset password"
     Subject: Шинэ Амь порталын нууц үг сэргээх -->
<div style="margin:0;padding:32px 16px;background:#f4f1ea;font-family:Arial,Helvetica,sans-serif;color:#1c1c1f">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px">
    <p style="margin:0 0 4px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#b8924f">Шинэ Амь Христийн Чуулган</p>
    <h1 style="margin:0 0 16px;font-size:22px">Нууц үг сэргээх</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.6">
      Таны нууц үгийг сэргээх хүсэлт ирлээ. Доорх товч дээр дарж шинэ нууц үгээ тохируулна уу.
    </p>
    <p style="margin:0 0 24px">
      <a href="{{ .SiteURL }}/portal/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
         style="display:inline-block;background:#1c1c1f;color:#ffffff;text-decoration:none;font-weight:bold;padding:14px 28px;border-radius:999px">
        Шинэ нууц үг тохируулах
      </a>
    </p>
    <p style="margin:0;font-size:13px;line-height:1.6;color:#6b6b72">
      Хэрэв та энэ хүсэлтийг илгээгээгүй бол энэ захидлыг үл тоомсорлоно уу. Таны нууц үг өөрчлөгдөхгүй.
    </p>
  </div>
</div>
