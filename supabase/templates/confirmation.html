<!-- Supabase → Authentication → Emails → "Confirm signup"
     Subject: Шинэ Амь порталын бүртгэлээ баталгаажуулна уу -->
<div style="margin:0;padding:32px 16px;background:#f6f8f6;font-family:Arial,Helvetica,sans-serif;color:#27312b">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #dce3de;border-radius:16px;padding:32px">
    <img src="https://newlife.mn/logo.png" alt="Шинэ Амь Христийн Чуулган" width="120" height="56" style="display:block;margin:0 0 24px;border:0;height:auto" />
    <h1 style="margin:0 0 16px;font-size:22px;color:#05532e">Бүртгэлээ баталгаажуулна уу</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.6">
      Гишүүдийн порталд бүртгүүлсэнд баярлалаа. Доорх товч дээр дарж имэйл хаягаа баталгаажуулна уу.
    </p>
    <p style="margin:0 0 24px">
      <a href="{{ .SiteURL }}/portal/auth/confirm?token_hash={{ .TokenHash }}&type=email"
         style="display:inline-block;background:#056839;color:#ffffff;text-decoration:none;font-weight:bold;padding:14px 28px;border-radius:999px">
        Баталгаажуулах
      </a>
    </p>
    <p style="margin:0;font-size:13px;line-height:1.6;color:#526057">
      Хэрэв та бүртгүүлээгүй бол энэ захидлыг үл тоомсорлоно уу.
    </p>
  </div>
</div>
